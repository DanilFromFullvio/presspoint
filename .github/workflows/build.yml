name: Build & deploy PressPoint

on:
  schedule:
    - cron: "*/30 * * * *"   # každých 30 minút (minimum GitHub Actions je 5 min)
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: presspoint-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Stiahnuť správy a vygenerovať web
        run: node src/build.js
      - name: Uložiť archív článkov do repozitára
        run: |
          git config user.name "presspoint-bot"
          git config user.email "bot@presspoint.sk"
          git add data/archive.json data/last-run.json
          git diff --staged --quiet || git commit -m "chore: aktualizácia archívu $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
